# Generated by `pnpm deploy:sync`. Edit `deploy/config.ts`, then re-run sync.
# Dokploy: Compose path ./docker-compose.yml — set dokploy.domain in deploy/config.ts then re-sync.
# Image is published by .github/workflows/release-image.yml. pull_policy always fetches latest.

services:
  better-auth-server:
    image: ghcr.io/t3xydev/better-auth-server:latest
    pull_policy: always
    restart: always
    ports:
      - "3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.better-auth-server.rule=Host(`auth.example.com`)"
      - "traefik.http.routers.better-auth-server.entrypoints=websecure"
      - "traefik.http.routers.better-auth-server.tls.certResolver=letsencrypt"
      - "traefik.http.services.better-auth-server.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true
