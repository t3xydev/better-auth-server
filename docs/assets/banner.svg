<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-label="Better Auth Server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101828"/>
      <stop offset="1" stop-color="#0A3D3A"/>
    </linearGradient>
    <linearGradient id="glow" x1="900" y1="80" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="180" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#99F6E4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1080" cy="180" r="260" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(96,214)">
    <rect width="88" height="212" rx="8" fill="url(#accent)"/>
    <rect x="124" width="88" height="212" rx="8" fill="url(#accent)" fill-opacity="0.55"/>
    <rect x="62" y="0" width="88" height="70" rx="8" fill="url(#accent)"/>
    <rect x="62" y="142" width="88" height="70" rx="8" fill="url(#accent)" fill-opacity="0.8"/>
  </g>

  <text x="360" y="278" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Better Auth Server</text>
  <text x="360" y="340" fill="#99F6E4" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="500">Deploy a production auth server in minutes</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#CBD5E1">
    <rect x="360" y="390" width="168" height="40" rx="20" fill="#134E4A" fill-opacity="0.55" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="444" y="416" text-anchor="middle">OAuth / OIDC</text>

    <rect x="544" y="390" width="132" height="40" rx="20" fill="#134E4A" fill-opacity="0.55" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="610" y="416" text-anchor="middle">Passkeys</text>

    <rect x="692" y="390" width="100" height="40" rx="20" fill="#134E4A" fill-opacity="0.55" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="742" y="416" text-anchor="middle">2FA</text>

    <rect x="808" y="390" width="120" height="40" rx="20" fill="#134E4A" fill-opacity="0.55" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="868" y="416" text-anchor="middle">Nostr</text>

    <rect x="944" y="390" width="168" height="40" rx="20" fill="#134E4A" fill-opacity="0.55" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="1028" y="416" text-anchor="middle">Admin panel</text>
  </g>

  <text x="360" y="520" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Next.js ù PostgreSQL ù Drizzle ù Better Auth</text>
</svg>
